<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Markov Chains</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            padding:20px;
            background:#dbeafe, #f0f9ff;
        }

        textarea{
            width:600px;
            height:300px;
            font-size:14px;
            padding:10px;
            border-radius:10px;
            border:1px solid #ccc;
            resize:none;
            margin-top:10px;
        }

        input{
            padding:10px;
            border-radius:8px;
            border:1px solid #bbb;
            margin-right:10px;
        }

        button{
            padding:10px 16px;
            border:none;
            border-radius:8px;
            background:#4a6cf7;
            color:white;
            cursor:pointer;
            margin-right:10px;
        }

        button:hover{
            background:#3451c7;
        }

        .controls{
            margin-bottom:15px;
        }
    </style>
</head>

<body>

    <h2>Տեքստի գեներացման օրինակ</h2>

    <div class="controls">
        <input id="myNumInput"
               type="number"
               min="1"
               max="500"
               placeholder="Բառերի քանակ">

        <!-- Նոր input -->
        <input id="seedInput"
               type="text"
               placeholder="Սկսվող բառ">

        <button id="myButton">Click here</button>

        <button id="clear">Մաքրել</button>
    </div>

    <textarea id="myInputWindow"
              placeholder="Մուտքագրեք տեքստը այստեղ"></textarea>

    <textarea id="myOutput"
              placeholder="Արդյունքը այստեղ"></textarea>

    
    
<h3>Մարկովյան Գրաֆ</h3>

<div id="network"
     style="
     width:100%;
     height:700px;
     background:#081426;
     border-radius:15px;">
</div>

<!-- vis.js -->
<script
src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js">
</script>
<script src="mmarkov.js"></script>
    <script src="index.js"></script>
    <script src="graph.js"></script>
</body>
</html>
